<style>
/* Layout: single 960px editorial column; list of wide case cards, then long-form case pages with a sticky section bar. Single light theme by design. */
:root{
  --bg:#ffffff;
  --ink:#141313;
  --muted:#5c5c5c;
  --canvas:#f7f5f1;
  --sand:#eee8df;
  --brown:#6e5a42;
  --tan:#c9b8a0;
  --rule:rgba(20,19,19,0.1);
  --rule-soft:rgba(20,19,19,0.08);
  --font:'Urbanist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --gutter:40px;
  color-scheme:light;
}
@media (max-width:640px){:root{--gutter:20px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
a{color:var(--ink)}
img{max-width:100%;display:block}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brown);outline-offset:3px;border-radius:4px}
.wrap{max-width:960px;margin:0 auto;padding-inline:var(--gutter)}
.eyebrow{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;background:var(--sand);color:var(--brown);font-size:11px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;padding:4px 12px;border-radius:999px}
.label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--brown)}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-weight:600}

/* Header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:53px}
.brand{font-size:14px;font-weight:600;letter-spacing:-0.35px;text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:24px}
.nav a{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;text-decoration:none;color:var(--muted)}
.nav a[aria-current="page"],.nav a:hover{color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:14px;font-weight:600;min-width:0}
.back span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Home */
.hero{padding-block:64px 8px}
.hero h1{font-size:clamp(36px,7vw,64px);line-height:1.04;letter-spacing:-1.4px}
.hero h1 em{font-style:normal;color:var(--brown)}
.hero p{margin:22px 0 0;color:var(--muted);font-size:17px;line-height:1.6;max-width:600px}
.proof{display:grid;grid-template-columns:repeat(3,1fr);margin-top:40px;border-top:1px solid var(--rule)}
.proof div{padding:18px 20px 0 0;min-width:0}
.proof div+div{padding-left:20px;border-left:1px solid var(--rule)}
.proof b{display:block;font-size:22px;font-weight:600;letter-spacing:-0.3px;font-variant-numeric:tabular-nums}
.proof span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
@media (max-width:640px){.proof{grid-template-columns:1fr}.proof div,.proof div+div{padding:14px 0;border-left:0;border-bottom:1px solid var(--rule)}}
.card-foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:18px}
.card-foot .company{margin-top:0}
.card-out{font-size:13px;font-weight:600;color:var(--ink)}
.tldr{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:28px;padding-top:22px;border-top:1px solid var(--ink)}
.tldr p{margin:8px 0 0;font-size:14.5px;line-height:1.55}
@media (max-width:720px){.tldr{grid-template-columns:1fr;gap:18px}}
.filters{padding-block:28px 0}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.pill{padding:6px 16px;border-radius:999px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--muted);border:1px solid rgba(20,19,19,0.15)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:24px;padding-block:40px 72px}
.card{display:grid;grid-template-columns:1fr 1fr;text-decoration:none;color:inherit;background:var(--bg);border:1px solid var(--rule);border-radius:16px;overflow:hidden;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 24px rgba(20,19,19,0.08)}
.card-media{position:relative;min-height:100%;background:var(--canvas);overflow:hidden;max-width:100%}
.card-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.card-media .soon{position:absolute;inset:0}
.card-body{padding:24px 32px;position:relative;min-width:0}
.card-body h2{font-size:24px;line-height:1.25;margin-top:14px;padding-right:20px}
.card-body p{font-size:14px;color:var(--muted);margin:12px 0 0}
.card-body .company{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-top:16px}
.card-arrow{position:absolute;top:28px;right:28px;color:rgba(20,19,19,0.35);transition:transform .2s,color .2s}
.card:hover .card-arrow{transform:translateX(3px);color:var(--ink)}
@media (max-width:720px){
  .card{grid-template-columns:1fr}
  .card-media{aspect-ratio:16/9;min-height:0}
  .card-body{padding:20px}
  .card-body h2{font-size:21px}
  .card-arrow{top:22px;right:20px}
}

/* Contact */
.contact{border-top:1px solid var(--rule);padding-block:56px 72px}
.contact h2{font-size:30px;line-height:1.2}
.contact p{color:var(--muted);margin:10px 0 24px;max-width:520px}
.contact-rows{display:flex;flex-direction:column;gap:14px}
.contact-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.contact-row .label{width:84px}
.contact-row a,.contact-row .val{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.copy{border:1px solid rgba(20,19,19,0.15);background:transparent;border-radius:999px;padding:4px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.foot{border-top:1px solid var(--rule);padding-block:20px 32px;font-size:12px;color:var(--muted)}

/* Case page */
.case-top{padding-block:40px 0}
.case-top h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin-top:14px;letter-spacing:-0.4px}
.case-top .lede{color:var(--muted);font-size:16px;margin:12px 0 0;max-width:640px}
.stage{margin-top:28px;border-radius:16px;overflow:hidden;background:var(--canvas);aspect-ratio:16/9;max-width:100%;position:relative}
.stage-btn{all:unset;display:block;width:100%;height:100%;cursor:zoom-in}
.stage img{width:100%;height:100%;object-fit:contain}
.stage-nav{position:absolute;inset:auto 12px 12px auto;display:flex;gap:8px}
.stage-nav button{width:36px;height:36px;border-radius:999px;border:1px solid var(--rule);background:rgba(255,255,255,0.92);cursor:pointer;font-size:16px;display:grid;place-items:center}
.stage-nav button:hover{border-color:var(--ink)}
.thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding:2px}
.thumb{flex:0 0 auto;width:64px;height:36px;border-radius:6px;overflow:hidden;border:2px solid var(--rule);padding:0;cursor:pointer;background:var(--canvas)}
.thumb[aria-current="true"]{border-color:var(--brown)}
.thumb img{width:100%;height:100%;object-fit:cover}
.cap{margin-top:16px;max-width:720px}
.cap h3{font-size:20px}
.cap p{margin:6px 0 0;color:var(--muted);font-size:14px}
.cap .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:8px;font-weight:500}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-top:24px;padding-top:24px;border-top:1px solid var(--rule)}
.meta div div:last-child{font-size:14px;margin-top:4px;line-height:1.4}
.secbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:40;background:rgba(255,255,255,0.96);margin-top:40px}
.secbar .row{display:flex;gap:20px;overflow-x:auto;border-block:1px solid var(--rule);scrollbar-width:none}
.secbar .row::-webkit-scrollbar{display:none}
.secbar button{all:unset;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-block:14px;border-bottom:2px solid transparent}
.secbar button:hover{color:var(--ink)}
.secbar button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.secbar button:focus-visible{outline:2px solid var(--brown)}
.sections{display:flex;flex-direction:column;gap:64px;padding-block:48px 64px}
.sec{scroll-margin-top:120px;min-width:0}
.sec>h2{font-size:30px;margin-bottom:20px}
.phase-title{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--brown);font-weight:600;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:-24px}
.sub>h3{font-size:22px;margin-bottom:16px}
.body{display:flex;flex-direction:column;gap:20px;max-width:760px}
.body.wide{max-width:none}
.p{margin:0;font-size:15px;line-height:1.7}
.m{margin:0;font-size:14px;color:var(--muted);line-height:1.65}
.note{margin:0;font-size:14px;color:var(--muted);font-style:italic}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.list li{font-size:14px;color:var(--muted);line-height:1.6}
.list strong{color:var(--ink);font-weight:600}
ol.list li::marker{color:var(--brown);font-weight:600}
.stats{display:flex;gap:16px 40px;flex-wrap:wrap}
.stat .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:4px;max-width:220px}
.points{display:flex;flex-direction:column;gap:24px}
.points h3{font-size:17px;margin-bottom:8px}
.persona-head h3{font-size:20px;margin-top:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;background:rgba(238,232,223,0.5);border-radius:12px;padding:20px}
.fields div div:last-child{font-size:13px;line-height:1.45;margin-top:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px}
.cols h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.cols .list li{font-size:13px}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;max-width:100%}
.tbl table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:10px 14px;text-align:left;vertical-align:top;font-size:12.5px;line-height:1.45;border-top:1px solid var(--rule-soft);border-left:1px solid var(--rule-soft)}
.tbl thead th{background:var(--canvas);font-weight:600;font-size:12px;color:var(--ink);border-top:0}
.tbl tbody th{background:var(--sand);color:var(--brown);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;position:sticky;left:0;border-left:0}
.tbl thead th:first-child{background:var(--sand);color:var(--brown);font-size:11px;text-transform:uppercase;letter-spacing:.6px;position:sticky;left:0;border-left:0}
.tbl td{color:var(--muted)}
.tbl.wide table{min-width:1100px}
.tbl.wide td,.tbl.wide thead th{min-width:150px}
.tbl .out{opacity:.55}
.tbl-cap{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:-8px}
.findings{display:flex;flex-direction:column;gap:22px}
.finding{border-left:2px solid var(--tan);padding-left:16px}
.finding h4{font-size:15px;margin-bottom:6px}
.finding p{margin:0;font-size:14px;color:var(--muted)}
.finding .resp{margin-top:8px;color:var(--ink)}
.finding .resp b{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--brown);margin-right:6px}
.finding a{color:inherit}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .node{flex:1 1 120px;background:var(--canvas);border-radius:10px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.35}
.flow .node small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.flow .end{background:var(--ink);color:var(--canvas)}
.flow .end small{color:rgba(247,245,241,0.7)}
.flow-esc{margin-top:8px;border:1px dashed var(--tan);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--brown)}
.steps{display:flex;flex-direction:column;gap:16px}
.step{border:1px solid var(--rule);border-radius:12px;padding:20px}
.step-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.step-h span{font-size:13px;font-weight:600;color:var(--brown);font-variant-numeric:tabular-nums}
.step-h h4{font-size:17px}
.step .kv{margin-bottom:10px}
.step .kv:last-child{margin-bottom:0}
.step .kv .k{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.step .kv p{margin:0;font-size:13.5px;line-height:1.5}
.step .esc{margin-top:12px;padding-top:12px;border-top:1px dashed var(--tan);font-size:13px;color:var(--muted)}
.mini{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.mini li{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--rule-soft);font-size:14px}
.mini li:first-child{border-top:0}
.mini li::before{counter-increment:s;content:counter(s);font-weight:600;color:var(--brown);font-variant-numeric:tabular-nums}
.mini b{font-weight:600}
.mini span{color:var(--muted)}
.mini .loop{grid-column:2;font-size:12.5px;color:var(--brown)}
.fig{background:var(--canvas);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.fig button{all:unset;cursor:zoom-in;display:block;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--rule-soft)}
.fig img{width:100%}
.fig p{margin:0;font-size:14px;line-height:1.65}
.badges{display:flex;gap:16px 36px;flex-wrap:wrap}
.badge{display:flex;align-items:baseline;gap:10px}
.badge .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.badge .l{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.refl{display:flex;flex-direction:column;gap:20px}
.refl p{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.65}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:6px 14px}
.links a:hover{border-color:var(--ink)}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--rule);padding-block:28px;text-decoration:none}
.next .t{font-size:20px;font-weight:600;line-height:1.3}
.next:hover .t{text-decoration:underline;text-underline-offset:4px}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,19,19,0.88);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 24px max(24px,env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.4);background:var(--bg)}
.lb-close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:40px;height:40px;border-radius:999px;border:0;background:var(--bg);font-size:18px;cursor:pointer}
.soon{width:100%;height:100%;display:grid;place-items:center;background:var(--canvas)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

</head>

<header class="site-head"><div class="wrap" id="head"></div></header>
<main id="app"></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Image preview">

</div>

const CASES=[
{
 slug:'design-system',
 title:'Design System & Principles for a Multi-Tenant AI Platform',
 tag:'Design Systems', company:'Pillar Lab',
 desc:'A component library and token system built from a blank slate, made to hold up as the shared foundation for every product built on top of it.',
 card:'assets/ds-slide-05.webp',
 meta:[['Role','Design lead'],['Built from','Zero'],['Covers','Conversational AI, customer apps, internal portals']],
 images:[

 ],
 sections:[

   {t:'p',x:'As design lead, I built the foundational layer myself: the infrastructure other people’s work would come to depend on, not just a style guide.'},
   {t:'list',items:['UI color scales','Core components','Interaction patterns other designers build on top of']},
   {t:'m',x:'Other designers contributed under my review, with every component benchmarked and stress-tested against real usage before being considered stable.'}
  ]},
  {id:'result',title:'Result',blocks:[
   {t:'p',x:'There’s no standalone metric for the system itself. Its impact shows up in what it enabled: the AI Mortgage Advisory Chat and Pillar Portal, both built and shipped on top of it.'},
   {t:'links',items:[['mortgage-chat','AI Mortgage Advisory Chat'],['pillar-portal','Pillar Portal']]}
  ]}
 ]
},
{
 slug:'mortgage-chat',
 title:'AI Mortgage Advisory Chat',
 tag:'Consumer Products', company:'Pillar Lab',
 desc:'A multi-tenant, regulation-bound AI sales chat, built for a customer decision with no existing local mental model to design against.',
 card:'assets/mortgage-carousel-1.webp',
 meta:[['Role','Sole Product Designer'],['Duration','~4.5 months: 1 month design and PRD, 2–3 weeks edge cases, 3 months development'],['Team','PM, engineers, copywriter, data analyst']],
 images:[
  ['assets/mortgage-carousel-1.webp','Chat, comparison & simulator','Quick-reply prompts, a side-by-side loan offer comparison, and the Loan Simulator panel with adjustable tenure and APR.'],
  ['assets/mortgage-feature-1.webp','Personalized quick-reply prompts','Prompts adapt to who’s asking: most-asked questions for a new visitor, a pinned resume-progress card for someone mid-application.'],
  ['assets/mortgage-feature-2.webp','In-chat data collection','Structured step cards collect the inputs a real calculation needs, without pulling the user out of the conversation.'],
  ['assets/mortgage-feature-3.webp','Transparent loan breakdown','Full APR structure across the loan term, fees and charges, and program benefits shown per bank offer, not just a headline rate.'],
  ['assets/mortgage-feature-4.webp','Real-time affordability check','Feasibility feedback tied to the user’s own financial profile, flagging comfortable versus limited-room scenarios before they commit.'],
  ['assets/mortgage-feature-5.webp','In-chat KYC & document upload','ID card capture and data extraction handled directly in the chat, with a confirmation step before the data is submitted.']
 ],
 sections:[
  {id:'setup',title:'Setup',blocks:[
   {t:'p',x:'Pillar needed to close two problems at once: an immediate ops cost problem, and a structural one that determined whether this could ever be more than a Ringkas-only tool.'},
   {t:'m',x:'The ops case, pulled directly from product intake data:'},
   {t:'list',items:[
    '<strong>~125 inquiries/day reaching human agents.</strong> About 40/day were repetitive advisory questions (product info, registration, application process, document upload, Akad) and about 85/day were pure wrong-product deflection: customers asking about KTA, P2P or insurance, products Ringkas doesn’t even sell.',
    '<strong>~55 agent-hours/week, roughly 1.3 FTE,</strong> spent on volume that had either already been answered before or should never have reached a human at all.',
    '<strong>A third, quieter loss:</strong> customers who reached “register to continue” in chat and didn’t complete registration in the separate Consumer WebApp. The drop-off was built into the handoff itself.'
   ]},
   {t:'stats',items:[['~125/day','Inquiries reaching human agents'],['~55 hrs/wk','Agent time, ~1.3 FTE']]},
   {t:'m',x:'Underneath the numbers sits a structural ceiling no amount of agent training fixes. Human advisory quality is gated by whichever agent happens to pick up, and it can’t personalize past a generic pitch at scale. An AI conversation’s baseline keeps improving with every iteration instead of plateauing.'},
   {t:'m',x:'The two problems compound, not stack. Solving the cost problem and the single-tenant lock-in in one build is what let Pillar turn this into a white-label product: a partner bank can now deploy this exact chat under their own brand, instead of Ringkas building a bespoke one per bank.'},
   {t:'m',x:'This wasn’t a simple deflection bot either. It had to hold an actual financial conversation, in a market with no existing playbook for what trustworthy AI mortgage advice should sound like.'}
  ]},
  {id:'challenge',title:'Challenge',blocks:[
   {t:'points',items:[
    ['No existing mental model.','Almost no one in Indonesia had experienced mortgage advice inside a chat before. There was no competitor to benchmark, no prior project to inherit patterns from, and no cultural default for what trustworthy AI financial advice should sound like. Every interaction pattern (how much to ask, how to phrase a recommendation, when to sound human versus official) had to be originated, not adapted. Getting it wrong wouldn’t just feel awkward; it would undermine the whole conversation’s trust.'],
    ['Completeness vs. comprehension.','Legal completeness pushes toward showing everything; usability pushes toward showing only what’s actionable. Holding that line against a more technical-leaning PM meant defending it on progressive disclosure.'],
    ['A genuinely new interaction shape.','This wasn’t a pure chat interface or a pure functional tool. It had to be both, letting customers converse naturally while completing tasks (uploading documents, adjusting a repayment slider, confirming a simulation) without fracturing into “now you’re chatting” versus “now you’re filling a form.” That meant deciding, case by case, when a functional element should surface versus stay conversational, with no established playbook, since chat-plus-functional-UI is still new territory even outside Indonesia.']
   ]}
  ]},
  {id:'persona',title:'Persona',blocks:[
   {t:'m',x:'Rather than a spread of buyer types, design was deliberately narrowed to one segment: first-time buyers. General buyer segmentation research (income band, life stage, risk tolerance, first-time vs. repeat) exists and could support more personas later. But building multiple buyer types before validating the chat’s core interaction pattern with even one would have front-loaded complexity the project didn’t have runway for. First-time buyers were the sharper starting point: the least mortgage-literate group, facing the steepest jargon curve, with the most to gain from a chat that demystifies the process.'},
   {t:'persona',kicker:'Mortgage webchat persona',label:'First-time buyer'},
   {t:'fields',items:[['Age range','Mid-20s to mid-30s'],['Occupation','Salaried, stable income'],['Tech comfort','Hesitant, prefers human contact'],['Motivation','A life event (marriage, new baby)'],['Key trait','Time-poor, with limited availability for research, documents, or unclear waiting']]},
   {t:'cols',cols:[
    ['Goals',['Secure a home in time for the life event, without financial strain','Get a realistic affordability picture before getting attached to a house','Minimal disruption to a full work schedule']],
    ['Frustrations',['Financial and legal jargon makes the process feel opaque','Chat-only interaction feels too risky for high-stakes decisions','No visibility into status during long waits','Document requirements feel like a moving target']],
    ['Needs',['Plain-language explanations of costs, terms, and requirements','Transparent, self-serve status tracking','A clear path to a human for high-stakes decisions','A process that respects limited time']]
   ]},
   {t:'tblcap',x:'Customer journey map: from low intent to applying'},
   {t:'journey',inScope:6,
    steps:['Looking for house','Installment and initial fee','Finding out requirements','Comparing loan programs','Pooling documents','Applying','Submit other docs','Tracking application status','Meet with notary','Akad day'],
    rows:[
     ['Do',['Browses listings casually, without a fixed budget','Searches for DP and installment info across banks','Checks document and eligibility lists; may self-check SLIK','Compares banks and programs manually, likely alone','Gathers KTP, NPWP, salary slips, bank statements from multiple sources','Submits the application and waits','Provides additional requested documents','Checks in by calling or visiting the bank for updates','Reviews and signs legal documents with the notary','Signs the final credit agreement in person']],
     ['Think',['“Can I actually afford this?”','“What does this mean for my finances?”','“Do I even qualify?”','“Which one is actually right for me?”','“Do I have everything they need?”','“It’s out of my hands now”','“Why do they need more? I thought I was done”','“Is it approved yet?”','“I don’t fully understand what I’m signing”','“This is really happening”']],
     ['Feel',['Hopeful and motivated, but untethered','Sticker shock; confused by tenor, fixed vs. floating','Anxious about credit history, even if overblown','Overwhelmed by jargon; wants guidance, not just options','Fatigue and frustration','Relief mixed with lingering anxiety','Frustrated; it feels like a moving target','Anxious uncertainty','Out of their depth','Relief and excitement, with last-minute nerves']],
     ['Unmet needs',['A grounded sense of real borrowing capacity before house hunting','Clear, personalized numbers instead of generic bank rates','Reassurance on eligibility before investing more emotion','Human-guided comparison of trade-offs, not raw options','A clear, fixed checklist that doesn’t shift','Visibility into what’s happening during the wait','Clear reasoning for why more documents are needed','Self-serve, real-time status without needing to ask','A human to walk through the legal paperwork','Confirmation everything is in order before the big moment']]
    ]},
   {t:'note',x:'Phase 1 scope: the shipped chat covers steps 1 to 6. Steps 7 to 10 (additional documents, status tracking, notary, and Akad) stay manual and downstream.'}
  ]},
  {id:'research',title:'Research Synthesis',blocks:[
   {t:'p',x:'With no digital product to study, I used the human channel as the closest proxy: interviewing customers who’d been through the manual version of this exact conversation with a bank’s own conversion staff, to reverse-engineer the flow and where people hesitated or dropped off. That became the insight base the mental model was built from.'},
   {t:'m',x:'To pressure-test what interviews alone couldn’t confirm, I checked published research and applied general UX principles where research didn’t exist:'},
   {t:'findings',items:[
    ['A fixed, unambiguous checklist isn’t just UX polish. It’s rejection prevention.','Missing or unclear document requirements are one of the most common places a KYC flow loses people. Vague formats (like “proof of address” with no guidance) force re-uploads, and every re-upload is a fresh chance to lose the customer.','The checklist shows accepted formats with a good-vs-bad example, not a generic rejection message.'],
    ['NPWP gets validated in Phase 1, not buried later.','NPWP is a <a href="https://mirailand.id/en/blog/checklist-dokumen-kpr-lengkap" target="_blank" rel="noopener">mandatory requirement with no exceptions at any Indonesian bank</a>, used to verify tax and income validity. Missing or invalid NPWP stalls applications at initial verification.','It’s checked early, before further effort goes into Phase 2.'],
    ['Human-in-the-loop isn’t a fallback. It’s a deliberate backstop.','Complex, multi-document processes lose people fastest at the moments they’re most uncertain. A visible human option changes what happens at that moment.','Escalation is a standing option at every step, framed as a designed path, not a patched-over gap.'],
    ['The interaction model borrows familiarity from WhatsApp, deliberately.','WhatsApp is the messaging app most Indonesians already use daily, for everything from casual chat to customer service. Building the flow to read the same way lowers the guard most people bring to anything that looks like a form.','The flow reads as a chat thread doing form-level work, not a form pretending to be a chat.']
   ]}
  ]},
  {id:'flow',title:'User Flow',blocks:[
   {t:'p',x:'The end-to-end journey moves through four stages, from an open-ended question to a submitted application. It’s deliberately scoped to the pre-application funnel for this phase; document review, notary, and Akad signing stay manual and downstream.'},
   {t:'flow',nodes:[['1. Q&A','Mortgages, loan programs'],['2. Simulation','Compare offers, check affordability'],['3. Registration','Confirm identity, create application'],['4. Document Upload','KTP, NPWP, KK, financial docs']],end:['Application submitted',''],esc:'Human escalation is available at every stage, triggered whenever the AI detects frustration.'},
   {t:'steps',items:[
    {n:1,h:'Q&A',kv:[['Customer does','Asks general questions about mortgages, loan programs, or their own financial situation.'],['Chat does','Answers conversationally and surfaces quick-reply prompts, personalized to whether the customer is new or has an application in progress, to guide toward a specific goal.']]},
    {n:2,h:'Simulation',kv:[['Customer does','Provides property price, type, income, and preferred tenor; compares loan offers side by side.'],['Chat does','Runs the affordability check and loan comparison in real time, showing full APR structure and fees per bank offer.']]},
    {n:3,h:'Registration',kv:[['Customer does','Confirms identity basics to move from general advisory into a tracked application.'],['Chat does','Creates the application record and transitions the customer into the document-collection stage.']]},
    {n:4,h:'Document Upload',kv:[['Customer does','Uploads KTP, NPWP, KK, and supporting financial documents against a fixed checklist.'],['Chat does','Validates each document on submission, flags issues inline (wrong format, expired ID, incomplete statement), and surfaces human escalation on detected frustration.']],esc:'Document Upload was the one point designed pre-launch on the assumption that Indonesian users would need a human backstop most when handling identity documents. Post-launch behavior confirmed it.'}
   ]}
  ]},
  {id:'exploration',title:'Design Exploration',blocks:[
   {t:'m',x:'Each of the four key moments in the flow went through three directions before landing on what shipped. Below is the shipped direction for each, with what got ruled out and why.'},
   {t:'fig',src:'assets/mortgage-explore-coldstart.webp',label:'Cold start · Option A, guided quick-reply menu',x:'Shipped over a step-by-step onboarding sequence and a jump-straight-to-input version. Option A frames four common intents (check affordability, compare programs, continue an application, talk to a human) as tappable options instead of an open text field. It’s the direct interface expression of the persona’s need for plain-language framing, and consistent with the personalized quick-reply prompts shown above.'},
   {t:'fig',src:'assets/mortgage-explore-affordability.webp',label:'Affordability calculator · Option A, live slider with instant estimate',x:'Shipped over a multi-turn Q&A collecting the same two numbers, and a static form. Option A resolves the number fastest, with no back-and-forth and nothing filled in blind, and keeps the chat behaving like a calculator instead of making the customer wait on a reply after every input.'},
   {t:'fig',src:'assets/mortgage-explore-comparison.webp',label:'Loan program comparison · Option B, side-by-side table, essential by default',x:'This is where the “holding the line on customer language” decision actually plays out. When the PM pushed for showing complete loan program information up front, I argued for leading with numbers a non-expert can act on (rate, monthly estimate, down payment) across all three programs at once, with “Show complete details for all” as an opt-in expansion. It beat a single-card swipe view because side-by-side comparison is the actual task here; making someone swipe and hold numbers in memory to compare three offers works against the moment’s goal.'},
   {t:'fig',src:'assets/mortgage-explore-upload.webp',label:'Document upload · Option B, suggested phases, nothing locked',x:'Documents are grouped into three suggested phases (identity, income, additional) instead of one flat list of six, but every phase stays open and tappable at any time. The order is a suggestion, not a gate. This mattered because the research already commits to a fixed, unambiguous checklist that doesn’t shift. A version that locked later phases until earlier ones were done would have reintroduced the moving-target feeling the checklist was designed to prevent.'}
  ]},
  {id:'metrics',title:'Success Metrics',blocks:[
   {t:'p',x:'<strong>Primary metric: transactions created through the chat per day.</strong> Defined as unique customer sessions that complete the full pre-application funnel: cold start, registration, transaction-level consent, KTP upload.'},
   {t:'list',items:['Baseline: 119 transactions/day across all channels, about 109 of them via the Consumer WebApp, the volume this chat is meant to shift','Target: at least 30/day within 3 months of launch, and at least 60/day (about 55% of the WebApp baseline) within 6 months']},
   {t:'table',head:['Secondary metric','Target'],rows:[['Funnel completion rate','≥30% within 3 months'],['Repetitive Ops inquiry reduction','↓40% within 2 months of launch'],['Simulation to application conversion','≥12%']]}
  ]},
  {id:'result',title:'Result',blocks:[
   {t:'p',x:'The chat is live and handling real conversations, but it’s too early post-launch to report against the targets above. It needs at least one full measurement window before transactions/day and funnel completion numbers mean anything.'},
   {t:'m',x:'Two signals point the right way in the meantime: the Document Upload escalation backstop is performing as designed, and the chat has been demoed to several prospective partners, with one client, Honda, already using it live under its own brand.'},
   {t:'badges',items:[['Live','Shipped and in production'],['Honda','Live under its own brand'],['≥30/day','Target within 3 months'],['≥60/day','Target within 6 months']]}
  ]},
  {id:'lesson',title:'Lesson Learned',blocks:[
   {t:'refl',items:[
    ['Reflection 1','Looking back, the one thing I’d push harder for is text formatting in longer AI responses. Financial product information is dense by nature, and an unformatted wall of text is heavy to read when the topic is someone’s mortgage. That’s a fight worth having earlier next time.'],
    ['Reflection 2','I should’ve pushed harder for usability testing on the genuinely new patterns. Chat-plus-functional-UI switching, frustration-triggered escalation, phased document collection: none of these had an existing playbook to validate against, in Indonesia or anywhere else. Next time I’d push for even lightweight usability testing specifically on the novel parts of the flow, rather than relying on judgment alone where there was the least precedent to fall back on.']
   ]}
  ]}
 ]
},
{
 slug:'pillar-portal',
 title:'Console for Managing Bank Partners & Configuring Their AI Agents',
 tag:'Internal Tools', company:'Pillar Lab',
 desc:'A large, complex internal console redesigned around information architecture and in-context guidance, for a non-tech-savvy internal team.',
 card:'assets/console-carousel-1.webp',
 meta:[['Product','Pillar Portal'],['Built from','Existing tool'],['Users','Engineering, PM, Growth, Ops']],
 images:[
  ['assets/console-carousel-1.webp','LLM provider configuration','The Add Provider panel sits over the LLM Providers list. Connecting a new model means naming it, picking a provider type and model, and supplying its API key.'],
  ['assets/console-carousel-2.webp','Provider list & status','Every connected model in one table: provider, assigned agents, last modified, and a per-provider enable/disable toggle.'],
  ['assets/console-carousel-3.webp','Provider detail & assigned agents','Drilling into a single provider surfaces its configuration, connection status, and every agent currently assigned to it.']
 ],
 sections:[
  {id:'setup',title:'Setup',blocks:[
   {t:'p',x:'Pillar wanted to turn years of accumulated mortgage domain knowledge and data into something the business could act on directly: LLM-powered AI agents that convert cold leads into warm ones for bank partners. Portal is the tool that makes that possible on the inside. It’s where Pillar’s internal team configures, tunes, and monitors those agents per partner, as opposed to the customer-facing product the agents produce.'},
   {t:'m',x:'Giving Engineering, PM, Growth, and Ops teams that control meant a console to onboard bank partners, configure agent behavior per partner, and monitor how leads were being qualified. But the earlier tool, with far more limited features, hadn’t kept pace. As more partners came on, complexity grew unevenly, and the system stopped teaching people what each setting actually did as they used it. People guessed their way through configuration that directly affected which leads got contacted and how.'}
  ]},
  {id:'challenge',title:'Challenge',blocks:[
   {t:'points',items:[
    ['Cognitive load, not a missing feature.','The earlier tool wasn’t self-explanatory, had weak information architecture, and didn’t teach users what each feature did as they encountered it. People guessed their way through configuration, costing real onboarding time for new hires and slowing down how fast a new bank partner’s AI agent could be set up.'],
    ['Technical, AI-specific territory for non-technical users.','Configuring an AI agent is inherently technical, but Portal’s actual users (PM, Growth, and Ops) often aren’t. Jargon they didn’t recognize, in a domain they hadn’t worked in before, made an already-unfamiliar task feel more nerve-wracking than it needed to be, especially since misconfiguring an agent has a live consequence on a real partner relationship.'],
    ['Complex features, complex interactions.','Beyond navigation, individual features weren’t simple form-fills. Several involved multi-step, branching configuration flows. The challenge wasn’t only organizing where things lived; it was making genuinely complex interactions feel manageable to someone doing this for the first time.']
   ]}
  ]},
  {id:'persona',title:'Persona',blocks:[
   {t:'m',x:'Portal’s internal audience isn’t one uniform user. Four roles use it differently, with different technical comfort and different stakes if something goes wrong.'},
   {t:'table',rowHead:true,head:['Role','Technical comfort','Primary task in Portal','Main risk if they get it wrong'],rows:[
    ['Engineering','High','Configures and maintains the underlying agent logic and integrations','A technical misconfiguration breaks agent behavior across multiple partners at once'],
    ['PM','Low to moderate','Reviews agent performance and coordinates priorities across partners','Misreading a partner’s setup leads to misaligned priorities or a delayed launch'],
    ['Growth Manager','Low','Tunes agent conversation and conversion behavior per partner','A poorly tuned agent turns off leads or misrepresents a partner’s brand voice'],
    ['Ops Manager','Low','Onboards new bank partners and monitors day-to-day account health','An onboarding error ships a partner’s agent live with the wrong settings']
   ]},
   {t:'cols',cols:[
    ['Goals',['Get a new bank partner’s agent live correctly, without routing every routine setup through engineering','Understand what a setting does before changing it, especially when it touches a live partner','Move through configuration confidently instead of guessing']],
    ['Needs',['In-context explanation of what a setting does before committing to a change','A clear signal for what’s low-risk to touch versus what affects a live partner','A shared pattern across features, so learning one part of Portal transfers to the next']]
   ]}
  ]},
  {id:'research',title:'Desk Research',blocks:[
   {t:'m',x:'No formal research round happened for Portal; the problem was identified directly from internal usage and complaints. To ground the redesign, I checked it against established UX practice:'},
   {t:'findings',items:[
    ['Jargon comprehension is relative, not absolute.','<a href="https://www.nngroup.com/articles/technical-jargon/" target="_blank" rel="noopener">Nielsen Norman Group’s guidance on technical jargon</a> notes that a term can be completely clear to one audience and unintelligible to another. That’s exactly the gap between Engineering and the PM, Growth and Ops teams using Portal, and it’s why explanations needed to live in the interface itself rather than assume shared vocabulary.',''],
    ['Progressive disclosure is the established response to this kind of complexity.','Hiding advanced options until they’re needed is a long-standing UX pattern for preventing cognitive overload in complex tools. It’s why the redesign leaned on layering settings by relation, usage frequency, and sensitivity instead of surfacing everything at once.',''],
    ['Structure around how people think, not how the system is built.','<a href="https://www.nngroup.com/articles/ia-study-guide/" target="_blank" rel="noopener">NN/g’s information architecture guidance</a> points to matching structure to users’ own mental models, via methods like card sorting, rather than organizing by internal system logic. The same instinct drove grouping Portal’s settings by relation, usage frequency, and sensitivity.','']
   ]}
  ]},
  {id:'flow',title:'User Flow',blocks:[
   {t:'m',x:'Getting a new bank partner live moves through eight steps, with a test-and-revise loop before anything ships.'},
   {t:'mini',items:[['Onboard partner','Register the new bank partner in Portal.'],['Upload knowledge docs','Feed the partner’s product and lending info into the agent’s knowledge base.'],['Set up campaign/program','Configure which loan programs and campaigns the agent should represent.'],['Set up cost','Configure pricing and cost parameters tied to the partner’s programs.'],['Test agent','Validate the agent’s behavior before it’s live.'],['Revise agent','Adjust configuration based on test results.','Loops back to Test agent until it passes'],['Deploy','Once testing passes, the agent goes live.'],['Hand over to partner','The partner takes over day-to-day use of their live agent.']]}
  ]},
  {id:'exploration',title:'Design Exploration',blocks:[
   {t:'p',x:'The restructure started with understanding the system before touching the interface, layering three lenses over every menu and feature:'},
   {t:'list',items:['<strong>Relation.</strong> How every menu and feature actually related to each other.','<strong>Usage frequency.</strong> What teams touch constantly versus rarely.','<strong>Sensitivity.</strong> What handles risk-bearing data versus what doesn’t.']},
   {t:'m',x:'That three-part lens turned a pile of features into an information architecture with real logic. To make that IA hold as a shared language, I led the creation of design principles with my team on Portal, a framework that originated in this project and was later adopted beyond Portal, into Pillar as a whole.'},
   {t:'links',items:[['design-system','See the Pillar design system']]}
  ]},
  {id:'hifi',title:'High Fidelity',blocks:[
   {t:'points',items:[['Decision: educating, not just labeling.','Hover tooltips, information banners, and an “ask AI” entry point built directly into the interface, so a non-tech-savvy user encountering unfamiliar jargon isn’t stuck guessing. An answer is one click away, in the moment it’s needed.']]},
   {t:'m',x:'To hold consistency at this scale, I built master pages and screen patterns in Figma as the benchmark, then generated the rest of the system’s pages with Claude Design based on each page’s function. The patterns weren’t fully locked down before generation started, so keeping everything consistent meant a cleanup pass afterward. Even so, it’s what made fast stakeholder collaboration and revision cycles possible on a system this large.'}
  ]},
  {id:'result',title:'Result',blocks:[
   {t:'p',x:'There’s no launch metric for an internal tool used only by Pillar’s own teams. The signal is informal feedback from PM, Growth, and Ops, pointing to two concrete wins: onboarding new team members onto Portal takes noticeably less time than before, and for the first time, teams can measure agent chat quality directly in the tool instead of relying on guesswork or manual spot-checks.'},
   {t:'badges',items:[['Faster','New-hire onboarding'],['In-tool','Agent chat quality measurement']]}
  ]},
  {id:'lesson',title:'Lesson Learned',blocks:[
   {t:'refl',items:[['Reflection','If I started Portal over, I’d invest more upfront in UI patterns and master pages before generating pages with AI. It would have kept the AI-generated output more consistent and under control from the start, rather than tightening it up after the fact.']]}
  ]}
 ]
},
{
 slug:'bukalapak-wholesale',
 title:'Wholesale Shopping & Discovery Experience for an E-Commerce Marketplace',
 tag:'Consumer Products', company:'Bukalapak',
 desc:'Fixing the wholesale buying flow first, then building the discovery layer on top. Each phase shipped and measured.',
 card:'assets/wholesale-carousel-1.webp',
 meta:[['Collaborated with','UX researcher'],['Shipped as','BukaGrosir'],['Result','+12% transactions, +22% GMV']],
 images:[
  ['assets/wholesale-carousel-1.webp','BukaGrosir entry point','The wholesale surface has its own homepage banner and app icon, leading straight into reseller-priced product carousels.'],
  ['assets/wholesale-carousel-2.webp','Unpersonalized Inspiration Ground','For buyers with no purchase history yet, the Ground shows general best-seller and trending wholesale picks instead of a blank state.'],
  ['assets/wholesale-carousel-3.webp','Trusted suppliers & wholesale picks','Below the recommendation carousels, the Ground surfaces trusted suppliers and category-wide wholesale picks.'],
  ['assets/wholesale-carousel-4.webp','Personalized for a known reseller','Once the system recognizes a buyer’s category (here, fashion resale), the Ground reorders around their specific insight: matching suppliers and stock.'],
  ['assets/wholesale-carousel-5.webp','Homepage entry point','The main banner carousel and homepage menu grid both link into BukaGrosir, alongside every other Bukalapak product.'],
  ['assets/wholesale-carousel-6.webp','Flexi banner entry point','A flexible, swappable placement highlights specific wholesale categories to trigger potential resellers.'],
  ['assets/wholesale-carousel-7.webp','Search & listing entry points','Popular-search suggestions and the “Grosir” filter on product listings both surface BukaGrosir, catching buyers who already show wholesale intent.']
 ],
 phases:[
  {id:'phase-1',title:'Phase 1 · Hygiene flow',sections:[
   {id:'p1-setup',title:'Setup',blocks:[
    {t:'p',x:'As Bukalapak expanded focus toward MITRA (its internal term for resellers) and wholesale buyers more broadly, data revealed a leak: roughly 20% of buyers in top categories were resellers or wholesale buyers, and 70% of them were sourcing products outside Bukalapak entirely.'},
    {t:'stats',items:[['20%','Top-category buyers are resellers or wholesale'],['70%','Of those source outside Bukalapak']]}
   ]},
   {id:'p1-challenge',title:'Challenge',blocks:[
    {t:'points',items:[['The existing journey wasn’t built for wholesale buyers.','Reviewing the wholesale buying journey found it inadequate for how these buyers actually shopped. That set the scope for two initiatives: creating a proper hygiene flow, and improving the wholesale products buying journey overall.']]}
   ]},
   {id:'p1-hifi',title:'High Fidelity',blocks:[
    {t:'list',items:['<strong>Price ranges on listing and detail pages,</strong> because cheapest-price comparison drives wholesale decisions.','<strong>Only 3 prices shown above the fold,</strong> reserving space for what mattered most in the comparison phase.','<strong>A “next cheaper price” nudge in cart,</strong> for buyers using the cart to simulate their final price.']},
    {t:'points',items:[['Usability testing insight.','The 3-price limit above the fold came directly from usability testing: people skim rather than read closely while comparing wholesale prices, so packing in more numbers just added noise. The same round of testing surfaced a habit that shaped the cart design. People were adding items to cart just to simulate the final price, treating the cart as a pricing calculator rather than a sign of purchase intent. That’s why the “next cheaper price” nudge went directly into the cart, meeting that habit instead of fighting it.']]}
   ]},
   {id:'p1-result',title:'Result',blocks:[

function block(b){
 switch(b.t){
  case 'p': return `<p class="p">${b.x}</p>`;
  case 'm': return `<p class="m">${b.x}</p>`;
  case 'note': return `<p class="note">${b.x}</p>`;
  case 'list': return `<ul class="list">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  case 'olist': return `<ol class="list">${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
  case 'stats': return `<div class="stats">${b.items.map(([v,l])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>`;
  case 'points': return `<div class="points">${b.items.map(([h,p])=>`<div><h3>${h}</h3><p class="m">${p}</p></div>`).join('')}</div>`;
  case 'persona': return `<div class="persona-head"><div class="eyebrow">${b.kicker}</div><h3>${b.label}</h3></div>`;
  case 'fields': return `<div class="fields">${b.items.map(([k,v])=>`<div><div class="label">${k}</div><div>${v}</div></div>`).join('')}</div>`;
  case 'cols': return `<div class="cols">${b.cols.map(([h,items])=>`<div><h4>${h}</h4><ul class="list">${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>`;
  case 'tblcap': return `<div class="tbl-cap">${b.x}</div>`;
  case 'journey': return `<div class="tbl wide" tabindex="0" role="region" aria-label="Customer journey map, scrolls sideways"><table><thead><tr><th scope="col">Step</th>${b.steps.map((s,i)=>`<th scope="col" class="${i>=b.inScope?'out':''}">${i+1}. ${s}</th>`).join('')}</tr></thead><tbody>${b.rows.map(([l,cells])=>`<tr><th scope="row">${l}</th>${cells.map((c,i)=>`<td class="${i>=b.inScope?'out':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  case 'table': return `<div class="tbl" tabindex="0" role="region" aria-label="${esc(b.head[0])} table"><table><thead><tr>${b.head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>i===0&&b.rowHead?`<th scope="row">${c}</th>`:`<td${i===0?' style="color:var(--ink)"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  case 'findings': return `<div class="findings">${b.items.map(([h,p,r])=>`<div class="finding"><h4>${h}</h4><p>${p}</p>${r?`<p class="resp"><b>Design response</b>${r}</p>`:''}</div>`).join('')}</div>`;
  case 'flow': return `<div><div class="flow">${b.nodes.map(([t,s])=>`<div class="node">${t}<small>${s}</small></div>`).join('')}<div class="node end">${b.end[0]}</div></div><div class="flow-esc">${b.esc}</div></div>`;
  case 'steps': return `<div class="steps">${b.items.map(s=>`<div class="step"><div class="step-h"><span>${s.n}</span><h4>${s.h}</h4></div>${s.kv.map(([k,v])=>`<div class="kv"><div class="k">${k}</div><p>${v}</p></div>`).join('')}${s.esc?`<div class="esc">${s.esc}</div>`:''}</div>`).join('')}</div>`;
  case 'mini': return `<ol class="mini">${b.items.map(([h,d,loop])=>`<li><div><b>${h}</b>${d?`<br><span>${d}</span>`:''}</div>${loop?`<div class="loop">↺ ${loop}</div>`:''}</li>`).join('')}</ol>`;
  case 'fig': return `<figure class="fig" style="margin:0"><button type="button" data-zoom="${b.src}" aria-label="Enlarge: ${esc(b.label)}"><img src="${b.src}" alt="${esc(b.label)}" loading="lazy"></button><div class="label">${b.label}</div><p>${b.x}</p></figure>`;
  case 'badges': return `<div class="badges">${b.items.map(([v,l])=>`<div class="badge"><span class="v">${v}</span><span class="l">${l}</span></div>`).join('')}</div>`;
  case 'refl': return `<div class="refl">${b.items.map(([l,x])=>`<div><div class="label">${l}</div><p>${x}</p></div>`).join('')}</div>`;
  case 'links': return `<div class="links">${b.items.map(([s,l])=>`<a href="#${s}">${l} →</a>`).join('')}</div>`;
 }
 return '';
}

  <div class="cards">${list.map(c=>`<a class="card" href="#${c.slug}" id="card-${c.slug}"><div class="card-media">${c.card?`<img src="${c.card}" alt="" loading="lazy">`:`<div class="soon"><span class="tag">Preview coming soon</span></div>`}</div><div class="card-body"><span class="tag">${c.tag}</span><span class="card-arrow">${arrow}</span><h2>${c.title}</h2><p>${c.desc}</p><div class="card-foot"><div class="company">${c.company}</div>${TLDR[c.slug]?`<div class="card-out">${TLDR[c.slug].out}</div>`:''}</div></div></a>`).join('')}</div>
  ${contactBlock()}
 </div><footer class="foot"><div class="wrap">© 2026 Julianti Valentini</div></footer>`;
}

function renderCase(c){
 renderHead(c);
 document.title=`${c.title} · Julianti Valentini`;
 carousel={i:0,imgs:c.images};
 const groups=c.phases?c.phases:c.sections.map(s=>({id:s.id,title:s.title,single:s}));
 const body=c.phases
  ? c.phases.map(ph=>`<section class="sec" id="${ph.id}" aria-labelledby="${ph.id}-h"><h2 id="${ph.id}-h" style="font-size:30px;margin-bottom:28px">${ph.title}</h2><div style="display:flex;flex-direction:column;gap:48px">${ph.sections.map(s=>sec(s,'sub')).join('')}</div></section>`).join('')
  : c.sections.map(s=>sec(s)).join('');
 const idx=CASES.indexOf(c), nxt=CASES[(idx+1)%CASES.length];
 app.innerHTML=`<div class="wrap">
  <div class="case-top"><span class="tag">${c.tag}</span><h1>${c.title}</h1><p class="lede">${c.desc}</p>${TLDR[c.slug]?`<div class="tldr"><div><div class="label">Problem</div><p>${TLDR[c.slug].p}</p></div><div><div class="label">My call</div><p>${TLDR[c.slug].c}</p></div><div><div class="label">Outcome</div><p>${TLDR[c.slug].o}</p></div></div>`:''}
   <div class="stage">${c.images.length?`<button type="button" class="stage-btn" id="stage-btn" aria-label="Enlarge image"><img id="stage-img" alt=""></button>`:`<div class="soon"><span class="tag">Preview coming soon</span></div>`}
    ${c.images.length>1?`<div class="stage-nav"><button type="button" id="prev" aria-label="Previous image">←</button><button type="button" id="next" aria-label="Next image">→</button></div>`:''}</div>
   ${c.images.length>1?`<div class="thumbs" role="group" aria-label="Images">${c.images.map((im,i)=>`<button type="button" class="thumb" data-i="${i}" aria-label="Show image ${i+1}: ${esc(im[1])}"><img src="${im[0]}" alt=""></button>`).join('')}</div>`:''}
   <div class="cap" aria-live="polite"><h3 id="cap-h"></h3><p id="cap-p"></p></div>
   <div class="meta">${c.meta.map(([k,v])=>`<div><div class="label">${k}</div><div>${v}</div></div>`).join('')}<div><div class="label">Company</div><div>${c.company}</div></div></div>
  </div>
 </div>
 <nav class="secbar" aria-label="Sections"><div class="wrap"><div class="row">${groups.map(g=>`<button type="button" data-go="${g.id}">${g.title}</button>`).join('')}</div></div></nav>
 <div class="wrap"><div class="sections">${body}</div>
  <a class="next" href="#${nxt.slug}"><div><div class="eyebrow">Next case</div><div class="t">${nxt.title}</div></div>${arrow}</a>
  <div id="contact-case">${contactBlock().replace('id="contact"','id="contact-inner"').replace(/contact-h/g,'contact-h2')}</div>
 </div><footer class="foot"><div class="wrap">© 2026 Julianti Valentini</div></footer>`;
 if(c.images.length) showImg(0); else if(c.emptyCaption){ $('#cap-h').textContent=c.emptyCaption[0]; $('#cap-p').textContent=c.emptyCaption[1]; }
 watchSections(groups.map(g=>g.id));
}

function showImg(i){
 const n=carousel.imgs.length; if(!n) return;
 carousel.i=(i+n)%n; const [src,cap,desc]=carousel.imgs[carousel.i];
 const img=$('#stage-img'); img.src=src; img.alt=cap;
 $('#cap-h').innerHTML=`${cap}${n>1?`<span class="count">${carousel.i+1} / ${n}</span>`:''}`;
 $('#cap-p').textContent=desc;
 document.querySelectorAll('.thumb').forEach((t,j)=>t.setAttribute('aria-current',j===carousel.i?'true':'false'));
 const active=document.querySelector('.thumb[aria-current="true"]');
 if(active){const row=active.parentElement;row.scrollLeft=active.offsetLeft-row.clientWidth/2+active.clientWidth/2;}
}

let io=null;
function watchSections(ids){
 if(io) io.disconnect();
 const btns=[...document.querySelectorAll('.secbar button')];
 const vis=new Map();
 io=new IntersectionObserver(es=>{
  es.forEach(e=>vis.set(e.target.id,e.isIntersecting?e.boundingClientRect.top:null));
  let best=null,bt=Infinity;
  ids.forEach(id=>{const t=vis.get(id); if(t!=null&&Math.abs(t)<bt){bt=Math.abs(t);best=id;}});
  if(best) btns.forEach(b=>{const on=b.dataset.go===best;b.setAttribute('aria-current',on?'true':'false');if(on){const r=b.parentElement;r.scrollLeft=b.offsetLeft-24;}});
 },{rootMargin:'-120px 0px -55% 0px'});
 ids.forEach(id=>{const el=document.getElementById(id); if(el) io.observe(el);});
}

function route(){
 const h=decodeURIComponent(location.hash.slice(1));
 const c=CASES.find(x=>x.slug===h);
 if(c){ renderCase(c); window.scrollTo(0,0); lastSlug=c.slug; return; }
 const onHome=!!document.querySelector('.hero');
 if(!onHome) renderHome();
 if(h==='contact'){ document.getElementById('contact')?.scrollIntoView(); }
 else if(lastSlug && document.getElementById('card-'+lastSlug)){ const el=document.getElementById('card-'+lastSlug); el.scrollIntoView({block:'center'}); el.focus({preventScroll:true}); lastSlug=null; }
 else if(!onHome || h==='work'){ window.scrollTo(0,0); }
}

/* Lightbox */
const lb=$('#lb'), lbImg=$('#lb-img'); let lbReturn=null;
function openLb(src,alt){ lbReturn=document.activeElement; lbImg.src=src; lbImg.alt=alt||''; lb.hidden=false; $('#lb-close').focus(); }
function closeLb(){ lb.hidden=true; lbImg.removeAttribute('src'); if(lbReturn) lbReturn.focus(); }

document.addEventListener('click',e=>{
 const t=e.target.closest('button,a'); if(!t) return;
 if(t.dataset.cat){ filter=t.dataset.cat; renderHome(); document.querySelector(`[data-cat="${filter}"]`).focus(); return; }
 if(t.id==='prev') return showImg(carousel.i-1);
 if(t.id==='next') return showImg(carousel.i+1);
 if(t.classList.contains('thumb')) return showImg(+t.dataset.i);
 if(t.id==='stage-btn'){ const im=carousel.imgs[carousel.i]; return openLb(im[0],im[1]); }
 if(t.dataset.zoom) return openLb(t.dataset.zoom,t.querySelector('img')?.alt);
 if(t.dataset.go){ document.getElementById(t.dataset.go)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); return; }
 if(t.dataset.copy){
  const done=()=>{t.textContent='Copied';setTimeout(()=>t.textContent='Copy',1600)};
  const fallback=()=>{const r=document.createRange();const v=t.parentElement.querySelector('.val');if(v){r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r);}t.textContent='Selected';setTimeout(()=>t.textContent='Copy',1600)};
  try{ navigator.clipboard.writeText(t.dataset.copy).then(done,fallback); }catch(_){ fallback(); }
  return;
 }
 if(t.getAttribute('href')==='#contact-case'){ e.preventDefault(); document.getElementById('contact-case')?.scrollIntoView(); }
});
lb.addEventListener('click',e=>{ if(e.target===lb||e.target.id==='lb-close') closeLb(); });
document.addEventListener('keydown',e=>{
 if(!lb.hidden){ if(e.key==='Escape') closeLb(); if(e.key==='Tab'){e.preventDefault();$('#lb-close').focus();} return; }
 if(!carousel.imgs.length||!document.getElementById('stage-img')) return;
 const inCar=e.target.closest&&e.target.closest('.stage,.thumbs');
 if(inCar&&e.key==='ArrowRight'){e.preventDefault();showImg(carousel.i+1);}
 if(inCar&&e.key==='ArrowLeft'){e.preventDefault();showImg(carousel.i-1);}
});
addEventListener('hashchange',route);
route();
</script>

</body>
